# nginx da VPS (container proxy_nginx, definido em ops/nginx/docker-compose.yml).
# Na VM fica em /opt/proxy/conf.d/vps.conf. Serve somente:
#   - financeiro.example.com          → container meu-financeiro:8080
#   - site.example.com  → site estático em /var/www/site
# Certificados Let's Encrypt — caminhos dentro do container: /etc/nginx/ssl/
#
# Depois de alterar: `docker exec proxy_nginx nginx -t && docker exec proxy_nginx nginx -s reload`.

server_tokens off;

limit_req_zone $binary_remote_addr zone=financeiro_login:10m rate=10r/m;

# ─── Qualquer outro host: recusa ─────────────────────────────────────────────

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ─── HTTP → HTTPS (e desafio ACME) ───────────────────────────────────────────

server {
    listen 80;
    server_name financeiro.example.com site.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ─── site.example.com — site estático (HTTPS) ─────────────────

server {
    listen 443 ssl;
    server_name site.example.com;

    ssl_certificate     /etc/nginx/ssl/site.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/site.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root  /var/www/site;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Arquivos de build que vivem na mesma pasta do site não devem ser servidos.
    location ~ /\. { deny all; }
    location ~* ^/(Dockerfile|nginx\.conf)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|svg|js|css)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

# ─── financeiro.example.com — Meu financeiro (HTTPS) ─────────────────────────

server {
    listen 443 ssl;
    server_name financeiro.example.com;

    ssl_certificate     /etc/nginx/ssl/financeiro.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/financeiro.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    client_max_body_size 2m;

    # Compressão das respostas da aplicação (JS, CSS e o JSON da API, que chega a dezenas de KB).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Os demais cabeçalhos de segurança (HSTS, CSP, X-Frame-Options...) vêm da aplicação (helmet).

    # resolver Docker interno — adia resolução DNS para não falhar no reload
    resolver 127.0.0.11 valid=10s;

    location = /api/auth/login {
        limit_req zone=financeiro_login burst=5 nodelay;
        limit_req_status 429;
        set $upstream_financeiro meu-financeiro;
        proxy_pass http://$upstream_financeiro:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_financeiro meu-financeiro;
        proxy_pass http://$upstream_financeiro:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
